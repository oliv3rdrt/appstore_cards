[[annotations]]
path = "openapi.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [".gitignore", ".nextcloudignore", ".nvmrc", ".github/dependabot.yml", "composer.json", "composer.lock", "package.json", "package-lock.json", "psalm.xml", "tests/phpunit.xml", "tsconfig.json", "vendor-bin/**/composer.json", "vendor-bin/**/composer.lock"]

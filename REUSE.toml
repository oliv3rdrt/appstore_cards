version = 1
SPDX-PackageName = "appstore_cards"
SPDX-PackageDownloadLocation = "https://github.com/oliv3rdrt/appstore_cards"

[[annotations]]
# The "card-search-outline" icon from Material Design Icons (@mdi/svg 7.4.47).
path = ["img/app.svg", "img/app-dark.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Pictogrammers and the Material Design Icons contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["Authors of the Deck, Calendar and Forms apps, as published on apps.nextcloud.com", "2026 Oliver Anyanwu"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [".gitignore", ".nextcloudignore", ".nvmrc", ".github/dependabot.yml", "composer.json", "composer.lock", "package.json", "package-lock.json", "psalm.xml", "tests/phpunit.xml", "tests/playwright/tsconfig.json", "tsconfig.json", "vendor-bin/**/composer.json", "vendor-bin/**/composer.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please report security issues privately, as described in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Post https://apps.nextcloud.com/apps/deck in a Talk conversation
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Link preview in Talk
        - Link preview in Text
        - Link preview on a public share page
        - Link preview somewhere else
        - Unified search
        - Smart Picker
        - Admin settings
        - Background job or occ command
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Store Cards version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud version
      placeholder: "35.0.3"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.36"
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - MariaDB
        - MySQL
        - PostgreSQL
        - Oracle
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For problems in the web interface.
      placeholder: Firefox 150 on Ubuntu
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Entries from nextcloud.log that mention appstore_cards, and any errors in the browser console. Remove anything private first.
      render: text

name: PHPUnit SQLite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phpunit-sqlite-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: appstore_cards

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'tests/**'
              - 'vendor-bin/**'
              - 'composer.json'
              - 'composer.lock'

  phpunit-sqlite:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix:
        # ADR 13: SQLite on every PHP version Nextcloud 35 supports, with coverage from PHP 8.3.
        php-versions: ['8.3', '8.4', '8.5']
        server-versions: ['stable35']
        include:
          - php-versions: '8.3'
            coverage: true

    name: SQLite PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Unlike the template, nextcloud/ocp stays installed: the unit tests need it, and the
      # server's own copy of the public API is loaded first in the integration tests.
      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/${{ env.APP_NAME }}

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: PHPUnit integration
        if: ${{ !matrix.coverage }}
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration

      # Unit tests also run in their own workflow; here they add to the coverage report.
      - name: PHPUnit unit and integration with coverage
        if: matrix.coverage
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run test:unit -- --coverage-php build/coverage/unit.cov
          composer run test:integration -- --coverage-php build/coverage/integration.cov
          vendor/bin/phpcov merge --clover build/coverage/clover.xml --text build/coverage/summary.txt build/coverage

      # ADR 13: at least 90% line coverage for lib/, without the bootstrap class and migrations.
      - name: Check coverage
        if: matrix.coverage
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          {
            echo '```'
            cat build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2016 # The single-quoted dollars are PHP variables.
          php -r '
            $metrics = simplexml_load_file("build/coverage/clover.xml")->project->metrics;
            $percent = 100 * (int)$metrics["coveredstatements"] / max(1, (int)$metrics["statements"]);
            printf("PHP line coverage: %.2f%%, required: 90%%\n", $percent);
            exit($percent >= 90 ? 0 : 1);
          '

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage
          path: |
            apps/${{ env.APP_NAME }}/build/coverage/clover.xml
            apps/${{ env.APP_NAME }}/build/coverage/summary.txt
          retention-days: 14

      - name: Print logs
        if: always()
        run: |
          [ ! -f data/nextcloud.log ] || cat data/nextcloud.log

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, phpunit-sqlite]

    if: always()

    name: phpunit-sqlite-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.phpunit-sqlite.result != 'success' }}; then exit 1; fi

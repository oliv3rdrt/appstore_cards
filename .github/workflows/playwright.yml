name: Playwright Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The template splits the tests over several machines and merges their reports.
  # This suite is small, so one job runs it and keeps one report.
  playwright:
    timeout-minutes: 30
    name: Playwright tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json
        uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
        id: versions

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Set up npm
        run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

      # The app has no runtime PHP dependencies, so the container needs only the built frontend.
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: npm run playwright:install-ci

      - name: Run Playwright tests
        run: npm run playwright

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [playwright]

    if: always()

    name: playwright-test-summary

    steps:
      - name: Summary status
        run: if ${{ needs.playwright.result != 'success' }}; then exit 1; fi

version: 2
updates:
  - package-ecosystem: composer
    directories:
      - "/"
      - "/vendor-bin/*"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    ignore:
      # Major versions change tooling and APIs, so they are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    ignore:
      # Major versions change tooling and APIs, so they are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
